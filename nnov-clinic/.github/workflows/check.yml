name: Check prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify domain logic
        run: npm run check
      - name: Ensure committed HTML matches sources
        run: git diff --exit-code -- index.html
